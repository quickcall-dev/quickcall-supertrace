name: Performance
description: Report a performance issue or optimization
title: "perf: "
labels: ["performance"]
assignees:
  - sagarsrc
projects:
  - quickcall-dev/1
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - backend
        - frontend
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's slow?
      placeholder: Describe the performance issue
    validations:
      required: true

  - type: textarea
    id: optimization
    attributes:
      label: Proposed fix
      placeholder: How can this be improved?
