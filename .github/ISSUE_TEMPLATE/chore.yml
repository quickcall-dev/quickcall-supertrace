name: Chore / Infrastructure
description: Infrastructure, DevOps, or maintenance task
title: "chore: "
labels: ["infra", "devops"]
assignees:
  - sagarsrc
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Features
      placeholder: |
        1. Feature one
        2. Feature two

  - type: textarea
    id: scripts
    attributes:
      label: Scripts/Config
      placeholder: |
        ```bash
        # Add any scripts or config here
        ```

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      placeholder: |
        - [ ] Deliverable 1
        - [ ] Deliverable 2
