name: Bug Report
description: Report a bug to help us improve
title: "fix: "
labels: ["bug", "triage"]
assignees:
  - sagarsrc
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: A clear description of what the bug is
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Issues to Fix
      placeholder: |
        ### 1. Issue Name
        - Description

        ### 2. Another Issue
        - Description
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      placeholder: Add screenshots if applicable

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - uvx
        - pip
        - Docker
        - From source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SuperTrace version
      placeholder: "0.1.8"

  - type: input
    id: reporter
    attributes:
      label: Reported by
      placeholder: Your name or GitHub username
