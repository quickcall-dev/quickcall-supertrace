name: Bug Report
description: Report a bug to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - uvx
        - pip
        - Docker
        - From source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SuperTrace version
      placeholder: "0.1.1"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14, Ubuntu 22.04, Windows 11"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Any other context, logs, or screenshots
