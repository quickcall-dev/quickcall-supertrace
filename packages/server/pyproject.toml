# FastAPI server for SuperTrace.
#
# Receives events from hooks, stores in SQLite, broadcasts via WebSocket,
# and serves REST API for the frontend.
#
# Related: src/supertrace_server/main.py (entry point)

[project]
name = "supertrace-server"
version = "0.1.0"
description = "SuperTrace tracing server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
]

[project.scripts]
supertrace-server = "supertrace_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supertrace_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
