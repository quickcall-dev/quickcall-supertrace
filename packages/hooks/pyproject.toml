# Hooks package for capturing Claude Code events.
#
# Installs as CLI tool 'supertrace' that receives hook events via stdin
# and forwards them to the tracing server.
#
# Related: src/supertrace/cli.py (entry point)

[project]
name = "supertrace-hooks"
version = "0.1.0"
description = "Claude Code hook handlers for SuperTrace"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
supertrace = "supertrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supertrace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
